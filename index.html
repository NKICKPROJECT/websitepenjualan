<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOURS - Modern Fashion & Apparel</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f4f7f6',
                            100: '#e3eae7',
                            500: '#1e3a34', // Emerald deep forest
                            600: '#142924',
                            700: '#0d1c18',
                            gold: '#c5a059', // Accent luxury gold
                            goldhover: '#b08c46'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Smooth Styling & Animations */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
        }

        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        .team-card {
            transition: all 0.3s ease;
        }

        .team-card:hover .team-overlay {
            opacity: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="antialiased selection:bg-brand-gold selection:text-white">

    <!-- Toast Notification Box (Pengganti alert) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modal Detail Pembelian / Redirect -->
    <div id="buy-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 m-4 shadow-2xl transform scale-95 transition-all duration-300" id="buy-modal-content">
            <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                <h3 class="text-xl font-bold text-gray-900" id="modal-product-title">Konfirmasi Pembelian</h3>
                <button onclick="closeBuyModal()" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="py-4 space-y-4">
                <div class="flex items-center gap-4">
                    <img id="modal-product-img" src="" alt="Produk" class="w-20 h-20 object-cover rounded-xl border">
                    <div>
                        <h4 id="modal-product-name" class="font-bold text-gray-800 text-lg"></h4>
                        <p id="modal-product-price" class="text-brand-gold font-semibold"></p>
                        <span class="text-xs text-gray-500">Stok Tersedia • Original Quality</span>
                    </div>
                </div>

                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 flex items-start gap-2">
                    <i class="fa-solid fa-circle-info mt-0.5 text-amber-600"></i>
                    <div>
                        <strong>Petunjuk Link Pembelian:</strong> Anda akan diarahkan ke link web/WhatsApp yang telah dikonfigurasi pada tombol produk ini.
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="closeBuyModal()" class="w-1/2 py-3 px-4 rounded-xl border border-gray-300 font-medium text-gray-700 hover:bg-gray-50 transition">
                    Batal
                </button>
                <a id="modal-buy-link" href="#" target="_blank" onclick="closeBuyModal()" class="w-1/2 py-3 px-4 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-center shadow-lg shadow-brand-500/20 transition flex items-center justify-center gap-2">
                    <span>Lanjutkan Ke Web</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Panel Pengaturan Cepat / Live Customizer -->
    <div id="settings-drawer" class="fixed right-0 top-1/4 z-40 translate-x-full transition-transform duration-300 ease-in-out bg-white shadow-2xl rounded-l-2xl border border-gray-200 w-80 p-5">
        <button onclick="toggleSettingsDrawer()" class="absolute -left-12 top-6 bg-brand-500 text-white p-3 rounded-l-xl shadow-lg hover:bg-brand-600 transition flex items-center justify-center">
            <i class="fa-solid fa-gear text-lg animate-spin-slow"></i>
        </button>
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h4 class="font-bold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-brand-gold"></i> Live Quick Editor
            </h4>
            <button onclick="toggleSettingsDrawer()" class="text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <p class="text-xs text-gray-500 mb-4">Ganti logo perusahaan secara langsung:</p>
        
        <div class="space-y-4">
            <!-- Opsi 1: Upload File dari Perangkat -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Upload Logo dari Komputer/HP:</label>
                <label for="input-logo-file" class="flex items-center justify-center gap-2 w-full p-3 border-2 border-dashed border-brand-gold/60 rounded-xl cursor-pointer hover:bg-amber-50/50 transition text-xs text-brand-gold font-bold">
                    <i class="fa-solid fa-cloud-arrow-up text-base"></i>
                    <span>Pilih File Gambar</span>
                </label>
                <input type="file" id="input-logo-file" accept="image/*" class="hidden" onchange="handleLogoFileUpload(event)">
            </div>

            <!-- Divider -->
            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-2 text-[10px] text-gray-400 font-semibold uppercase">atau</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Opsi 2: Input via URL -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Masukkan URL Gambar Logo:</label>
                <div class="flex gap-2">
                    <input type="text" id="input-logo-url" placeholder="https://..." 
                        class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-brand-gold outline-none">
                    <button onclick="updateLogoFromUrl()" class="bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold px-3 py-2.5 rounded-lg transition shadow flex-shrink-0">
                        Set
                    </button>
                </div>
            </div>
            
            <div class="pt-3 border-t flex justify-between items-center">
                <span class="text-[11px] text-gray-400">Status Penyimpanan:</span>
                <button onclick="resetLogo()" class="text-[11px] text-red-500 hover:underline font-medium">Reset Ke Default</button>
            </div>
        </div>
    </div>

    <!-- HEADER & NAVIGATION -->
    <header class="sticky top-0 z-30 glass-nav transition-all duration-300 border-b border-slate-200/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo Perusahaan -->
            <a href="#home" class="flex items-center gap-3 group">
                <div class="relative w-11 h-11 rounded-xl overflow-hidden shadow-md bg-brand-500 flex items-center justify-center p-0.5 group-hover:scale-105 transition-transform">
                    <img id="company-logo" 
                         src="assets/images/logo.png" 
                         alt="Logo Perusahaan" 
                         class="w-full h-full object-cover rounded-lg"
                         onerror="this.src='https://placehold.co/100x100/1e3a34/ffffff?text=LOGO'">
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-xl tracking-wider text-slate-900 group-hover:text-brand-gold transition-colors">VELOURS</span>
                    <span class="text-[10px] tracking-widest text-slate-500 uppercase -mt-1 font-semibold">Apparel Co.</span>
                </div>
            </a>

            <!-- Menu Navigasi Dekstop -->
            <nav class="hidden md:flex items-center gap-1 bg-slate-100/80 p-1.5 rounded-full border border-slate-200/80">
                <a href="#home" class="nav-link px-5 py-2 text-sm font-
